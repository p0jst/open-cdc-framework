site_name: Open CDC Framework
site_description: >-
  Open source framework for building and maturing SOCs / Cyber Defence Centers
  in the EU. NIST CSF 2.0, CIA triad, NIS2/GDPR/DORA, maturity model,
  playbooks, all 27 national annexes.
site_url: https://opencdc.org/
repo_url: https://github.com/p0jst/open-cdc-framework
repo_name: p0jst/open-cdc-framework
edit_uri: edit/main/

# Content is staged by `python site/build_site.py` (run it before mkdocs build)
docs_dir: _site_src
site_dir: _site_build

# MkDocs excludes a top-level templates/ dir by default (reserved for theme
# overrides); this repo uses it for document templates, so re-include it.
exclude_docs: |
  !/templates/
  !/templates/**

theme:
  name: material
  font: false            # system fonts only — no requests to Google Fonts
  icon:
    logo: material/shield-half-full
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit

extra_css:
  - assets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      # No paragraph-mark anchors beside headings. Heading ids are still
      # generated, so every section remains linkable via the table of contents.
      permalink: false
  - pymdownx.superfences
  # Renders "- [ ]" as a real (non-clickable) checkbox rather than literal
  # "[ ]" text. The reference checklists are meant to be printed or copied;
  # the interactive tool is where you actually tick things.
  - pymdownx.tasklist:
      custom_checkbox: false
  # Renders the bare URLs used throughout the references and national annexes
  # as real links instead of plain text.
  - pymdownx.magiclink:
      repo_url_shortener: false
      social_url_shortener: false
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

hooks:
  - site/hooks.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/p0jst/open-cdc-framework
copyright: >-
  Open CDC Framework · CC BY 4.0 · Not legal advice — verify regulatory
  references against EUR-Lex and national law.

nav:
  - Home: index.md
  - Start:
      - Introduction & design principles: docs/00-introduction.md
      - "Start here: the first 90 days": docs/09-start-here.md
      - Implementation tiers: docs/10-tiers.md
      - Reading guide: docs/README.md
      - Design navigator (workshops): assessments/cdc-design-navigator.md
      - Maturity self-assessment: assessments/maturity-self-assessment.md
  - Framework:
      - The six functions:
          - Govern: docs/01-govern.md
          - Identify: docs/02-identify.md
          - Protect: docs/03-protect.md
          - Detect: docs/04-detect.md
          - Respond: docs/05-respond.md
          - Recover: docs/06-recover.md
      - Lenses:
          - CIA triad as design lens: docs/07-cia-triad.md
          - Maturity model: docs/08-maturity-model.md
  - Organisation & operations:
      - Operating models: docs/11-operating-models.md
      - Roles & competences: docs/12-roles-and-competences.md
      - Running the CDC: docs/13-cdc-operations.md
      - Deep dives:
