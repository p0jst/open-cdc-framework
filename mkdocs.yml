          - Bulgaria: docs/annexes/annex-bg.md
          - Croatia: docs/annexes/annex-hr.md
          - Cyprus: docs/annexes/annex-cy.md
          - Czechia: docs/annexes/annex-cz.md
          - Denmark: docs/annexes/annex-dk.md
